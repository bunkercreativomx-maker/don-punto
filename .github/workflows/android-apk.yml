name: Android APK
# Compila y firma la app Android (Capacitor, carga donpunto.com + puente Bluetooth nativo)
# y la publica como release "android-latest" → URL fija:
#   https://github.com/bunkercreativomx-maker/don-punto/releases/download/android-latest/DonPunto.apk
on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
concurrency:
  group: android-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK (ya viene en el runner; solo aceptar licencias)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Dependencias Capacitor
        working-directory: native
        run: |
          npm ci --no-audit --no-fund
          mkdir -p www && echo '<!doctype html><title>Don Punto</title>' > www/index.html
          npx cap sync android
      - name: Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/donpunto.p12"
      - name: Compilar APK firmado
        working-directory: native/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/donpunto.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/DonPunto.apk"
          echo "{\"versionCode\":${{ github.run_number }},\"versionName\":\"1.0.${{ github.run_number }}\",\"date\":\"$(date -u +%FT%TZ)\"}" > "$RUNNER_TEMP/version.json"
      - name: Publicar release android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-latest && git push -f origin android-latest
          gh release delete android-latest -y 2>/dev/null || true
          gh release create android-latest "$RUNNER_TEMP/DonPunto.apk" "$RUNNER_TEMP/version.json" \
            --title "Don Punto Android 1.0.${{ github.run_number }}" \
            --notes "App Android de Don Punto (impresión Bluetooth nativa). Instala el APK en la tablet/celular." --latest=false
